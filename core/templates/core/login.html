{% extends "core/base.html" %}{% load i18n %}
{% block title %}{% trans "Sign in" %}{% endblock %}
{% block content %}
<div class="login panel">
  <h1>{% trans "Sign in" %}</h1>
  <p class="muted small">{{ COMPANY_NAME }}</p>
  {% if error %}<div class="nonfield">{{ error }}</div>{% endif %}
  <form method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="u">{% trans "Username" %}</label><input id="u" type="text" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">{% trans "Password" %}</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">{% trans "Sign in" %}</button>
  </form>
</div>
{% endblock %}
