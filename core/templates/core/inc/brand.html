{% load i18n %}{% if company.has_logo %}<span class="logo img"><img src="{% url 'company_logo' %}?v={{ company.logo_updated|date:'U' }}" alt=""></span>{% else %}<span class="logo">{{ company.initial }}</span>{% endif %}<span class="brand-text"><strong>{{ company.display_name }}</strong>{% if company.tagline %}<small>{{ company.tagline }}</small>{% elif company.name %}<small>{% trans "Cashier Manager" %}</small>{% endif %}</span>
