{% load i18n cashier %}{% with wa=c|wa_link pers=c.whatsapp|default:c.other_phone %}{% if c.business_sim or pers %}<button type="button" class="btn small call" data-call data-name="{{ c.name }}" data-biz="{{ c.business_sim }}" data-personal="{{ pers }}" title="{% trans 'Call' %}" aria-label="{% trans 'Call' %} {{ c.name }}">{% icon "phone" 15 %}</button>{% endif %}{% if wa %}<a class="btn small wa" href="{{ wa }}" target="_blank" rel="noopener" title="WhatsApp" aria-label="WhatsApp {{ c.name }}">{% icon "whatsapp" 15 %}</a>{% endif %}{% endwith %}
